name: Check and deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'progress/**'
      - 'conversations/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'progress/**'
      - 'conversations/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Check manifests
        run: npm run check:manifests
      - name: Run tests
        run: npm run test:node
      - name: Build static site
        run: npm run build:static

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://hot100.1919114.xyz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Add the repository secret CLOUDFLARE_API_TOKEN before deploying.'
            exit 1
          fi
          npm run deploy
      - name: Check published site
        run: curl --fail --retry 5 --retry-delay 3 https://hot100.1919114.xyz/ -o /dev/null
